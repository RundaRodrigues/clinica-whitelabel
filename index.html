<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clínica Médica — modelo white label</title>
<meta name="description" content="Modelo de site white label para clínicas médicas multiespecialidades.">
<meta name="theme-color" content="#1d5fd6">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/site.css">
</head>
<body>

<a class="skip-link" href="#main" data-b="ui.pularConteudo">Pular para o conteúdo</a>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <g id="i-heart" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 1 0-7.1 7.1l8.8 8.8 8.8-8.8a5 5 0 0 0 0-7.1Z"/></g>
    <g id="i-stethoscope" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v5a5 5 0 0 0 10 0V3"/><path d="M4 3H2m12 0h-2M9 13v3a5 5 0 0 0 10 0v-2"/><circle cx="19" cy="12" r="2"/></g>
    <g id="i-brain" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3a3 3 0 0 0-3 3 3 3 0 0 0-2 5.2A3 3 0 0 0 6 16.5 3 3 0 0 0 9.5 21a2.5 2.5 0 0 0 2.5-2.5V5.5A2.5 2.5 0 0 0 9.5 3Z"/><path d="M14.5 3a3 3 0 0 1 3 3 3 3 0 0 1 2 5.2 3 3 0 0 1-1.5 5.3A3 3 0 0 1 14.5 21 2.5 2.5 0 0 1 12 18.5V5.5A2.5 2.5 0 0 1 14.5 3Z"/></g>
    <g id="i-bone" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21a3 3 0 0 1-3-3 3 3 0 0 1 .3-5.4L12 5l7.7 7.6A3 3 0 0 1 20 18a3 3 0 0 1-3 3 3 3 0 0 1-5-1.7A3 3 0 0 1 7 21Z"/></g>
    <g id="i-child" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="3"/><path d="M12 8v6m-4 7 4-7 4 7M7 12h10"/></g>
    <g id="i-female" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M12 13v8m-3-3h6"/></g>
    <g id="i-skin" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r="1.2"/><circle cx="14" cy="14" r="1.6"/><circle cx="15" cy="8.5" r="1"/></g>
    <g id="i-eye" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></g>
    <g id="i-lungs" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11M8.5 8C7 8 6 9 5.4 11c-.8 2.6-1 4.6-.9 6.4A2 2 0 0 0 6.8 19l2.4-.8A2 2 0 0 0 10.5 16V9.5C10.5 8.7 9.6 8 8.5 8Z"/><path d="M15.5 8c1.5 0 2.5 1 3.1 3 .8 2.6 1 4.6.9 6.4A2 2 0 0 1 17.2 19l-2.4-.8A2 2 0 0 1 13.5 16V9.5c0-.8.9-1.5 2-1.5Z"/></g>
    <g id="i-scan" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5a2 2 0 0 1 2-2h3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M21 16v3a2 2 0 0 1-2 2h-3M3 12h18"/></g>
    <g id="i-mind" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0-4 10.5V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-3.5A6 6 0 0 0 12 3Z"/><path d="M10 21h4"/></g>
    <g id="i-nutri" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8c-2-3-6-3-7.5-.5C3 10 4 15 7 19c1.5 2 3.5 2 5 1 1.5 1 3.5 1 5-1 3-4 4-9 2.5-11.5C18 5 14 5 12 8Z"/><path d="M12 8V4"/></g>
    <g id="i-check" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"/></g>
    <g id="i-clock" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g>
    <g id="i-phone" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></g>
    <g id="i-pin" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></g>
    <g id="i-mail" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></g>
    <g id="i-star" fill="currentColor"><path d="M12 2.5l2.9 5.9 6.6.9-4.8 4.6 1.2 6.5L12 17.3 6.1 20.4l1.2-6.5L2.5 9.3l6.6-.9L12 2.5Z"/></g>
    <g id="i-wa" fill="currentColor"><path d="M17.5 14.4c-.3-.2-1.7-.9-2-1-.3-.1-.5-.2-.7.1-.2.3-.7 1-.9 1.2-.2.2-.3.2-.6.1-.3-.2-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.5-.6c.1-.2.2-.3.3-.5 0-.2 0-.4 0-.5 0-.2-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.2 3.3 5.2 4.6.7.3 1.3.5 1.8.6.7.2 1.4.2 1.9.1.6-.1 1.7-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4M12 2a10 10 0 0 0-8.5 15.2L2 22l4.9-1.4A10 10 0 1 0 12 2Z"/></g>
  </defs>
</svg>

<header class="header" data-header>
  <div class="wrap">
    <a class="logo" href="#top">
      <span class="logo-mark" data-b="sigla" translate="no">CN</span>
      <span data-b="nome" translate="no">Clinica Nucleo</span>
    </a>
    <nav class="nav" id="nav-menu" data-nav-menu aria-label="Navegação principal">
      <a href="#especialidades" data-b="nav.especialidades">Especialidades</a>
      <a href="#como-funciona" data-b="nav.comoFunciona">Como funciona</a>
      <a href="#equipe" data-b="nav.equipe">Corpo clínico</a>
      <a href="#faq" data-b="nav.faq">Dúvidas</a>
      <a href="#contato" data-b="nav.agendar">Agendar</a>
      <a class="btn btn-primary" href="#contato" data-b="nav.cta">Agendar consulta</a>
    </nav>
    <div class="header-cta">
      <a class="btn btn-primary" href="#contato" data-b="nav.cta">Agendar consulta</a>
      <button class="nav-toggle" data-nav-toggle aria-controls="nav-menu" aria-expanded="false" aria-label="Abrir menu">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main">

<section class="hero" id="top">
  <div class="wrap hero-grid">
    <div>
      <span class="eyebrow" data-b="hero.eyebrow"></span>
      <h1 data-bhtml="hero.tituloHtml"></h1>
      <p class="lead" data-b="hero.subtitulo"></p>
      <div class="hero-actions">
        <a class="btn btn-primary btn-lg" href="#contato" data-b="hero.ctaPrimario"></a>
        <a class="btn btn-ghost btn-lg" href="#especialidades" data-b="hero.ctaSecundario"></a>
      </div>
      <ul class="trust-row" data-list="hero.selos">
        <template><li class="trust-item"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-check"/></svg>{{.}}</li></template>
      </ul>
    </div>

    <div class="booking" data-reveal>
      <h3 data-b="agendamento.titulo"></h3>
      <p data-b="agendamento.subtitulo"></p>
      <form class="form-rows" data-form novalidate>
        <div class="field">
          <label for="b-nome" data-b="agendamento.labelNome"></label>
          <input id="b-nome" name="Nome" autocomplete="name" spellcheck="false" type="text" data-battr="placeholder:agendamento.hintNome" required>
        </div>
        <div class="field">
          <label for="b-tel" data-b="agendamento.labelWhats"></label>
          <input id="b-tel" name="WhatsApp" autocomplete="tel" inputmode="tel" spellcheck="false" type="tel" data-battr="placeholder:agendamento.hintWhats" required>
        </div>
        <div class="field">
          <label for="b-esp" data-b="agendamento.labelEspecialidade"></label>
          <select id="b-esp" name="Especialidade" autocomplete="off" data-list-options="servicos.especialidades"></select>
        </div>
        <div class="field">
          <label for="b-turno" data-b="agendamento.labelTurno"></label>
          <select id="b-turno" name="Turno" autocomplete="off" data-list-options="agendamento.turnos"></select>
        </div>
        <button class="btn btn-primary btn-block" type="submit" data-b="agendamento.cta"></button>
        <p class="form-status" data-form-status role="status" aria-live="polite"></p>
        <p class="form-note" data-b="agendamento.nota"></p>
      </form>
    </div>
  </div>
</section>

<section class="section" id="especialidades">
  <div class="wrap">
    <div class="section-head" data-reveal>
      <span class="eyebrow" data-b="servicos.eyebrow"></span>
      <h2 data-b="servicos.titulo"></h2>
      <p class="lead" data-b="servicos.subtitulo"></p>
    </div>
    <div class="grid grid-3" data-list="servicos.itens">
      <template>
        <article class="card spec-card" data-reveal data-delay="{{@index}}">
          <span class="icon-badge"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-{{icone}}"/></svg></span>
          <div><h3>{{titulo}}</h3><p>{{texto}}</p></div>
        </article>
      </template>
    </div>
  </div>
</section>

<section class="section" id="como-funciona" style="background:var(--surface)">
  <div class="wrap">
    <div class="section-head" data-reveal>
      <span class="eyebrow" data-b="passos.eyebrow"></span>
      <h2 data-b="passos.titulo"></h2>
    </div>
    <div class="grid grid-3 steps" data-list="passos.itens">
      <template>
        <div class="step" data-reveal data-delay="{{@index}}"><h3>{{titulo}}</h3><p>{{texto}}</p></div>
      </template>
    </div>

    <div style="margin-top:clamp(38px,4vw,56px)" data-reveal>
      <h3 class="center" style="font-size:var(--fs-h3);font-weight:650;margin-bottom:18px" data-b="convenios.titulo"></h3>
      <div class="plans-strip" data-list="convenios.itens">
        <template><span class="plan-chip">{{.}}</span></template>
      </div>
    </div>
  </div>
</section>

<section class="section" style="padding-block:0">
  <div class="wrap">
    <div class="stats" data-list="numeros" data-reveal>
      <template><div class="stat"><strong>{{valor}}</strong><span>{{label}}</span></div></template>
    </div>
  </div>
</section>

<section class="section" id="equipe">
  <div class="wrap">
    <div class="section-head" data-reveal>
      <span class="eyebrow" data-b="equipe.eyebrow"></span>
      <h2 data-b="equipe.titulo"></h2>
      <p class="lead" data-b="equipe.subtitulo"></p>
    </div>
    <div class="grid grid-4" data-list="equipe.itens">
      <template>
        <article class="card doc-card" data-reveal data-delay="{{@index}}">
          <img src="{{foto}}" alt="{{nome}}" loading="lazy" width="300" height="300">
          <div class="doc-body">
            <h3>{{nome}}</h3><p class="role">{{cargo}}</p><p class="crm">{{registro}}</p>
          </div>
        </article>
      </template>
    </div>
  </div>
</section>

<section class="section" id="depoimentos" style="background:var(--surface)">
  <div class="wrap">
    <div class="section-head" data-reveal>
      <span class="eyebrow" data-b="depoimentos.eyebrow"></span>
      <h2 data-b="depoimentos.titulo"></h2>
    </div>
    <div class="grid grid-3" data-list="depoimentos.itens">
      <template>
        <article class="card quote-card" data-reveal data-delay="{{@index}}">
          <div class="stars" role="img" aria-label="5 de 5 estrelas"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-star"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-star"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-star"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-star"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-star"/></svg></div>
          <blockquote>&ldquo;{{texto}}&rdquo;</blockquote>
          <footer><span class="avatar">{{inicial}}</span><div><div class="who">{{autor}}</div><div class="pet">{{detalhe}}</div></div></footer>
        </article>
      </template>
    </div>
  </div>
</section>

<section class="section" style="padding-block:0">
  <div class="wrap">
    <div class="cta-band" data-reveal>
      <div><h3 data-b="faixaFinal.titulo"></h3><p data-b="faixaFinal.texto"></p></div>
      <a class="btn btn-primary btn-lg" data-battr="href:_links.whatsapp" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" width="18" height="18"><use href="#i-wa"/></svg>
        <span data-b="faixaFinal.cta"></span>
      </a>
    </div>
  </div>
</section>

<section class="section" id="faq">
  <div class="wrap contact-grid">
    <div data-reveal>
      <span class="eyebrow" data-b="faq.eyebrow"></span>
      <h2 style="font-size:var(--fs-h2);font-weight:700;margin-block:13px 24px" data-b="faq.titulo"></h2>
      <div class="card hours-card">
        <h3 style="font-size:var(--fs-h3);font-weight:650;margin-bottom:10px" data-b="horarios.titulo"></h3>
        <div data-list="horarios.itens">
          <template><div class="hours-row"><span>{{dia}}</span><span>{{hora}}</span></div></template>
        </div>
        <p class="form-note" style="margin-top:14px" data-b="horarios.nota"></p>
      </div>
    </div>
    <div data-accordion data-reveal data-delay="1">
      <div data-list="faq.itens">
        <template>
          <div class="faq-item">
            <button class="faq-q" aria-expanded="false">{{p}}</button>
            <div class="faq-a"><div><p>{{r}}</p></div></div>
          </div>
        </template>
      </div>
    </div>
  </div>
</section>

<section class="section" id="contato" style="background:var(--surface)">
  <div class="wrap contact-grid">
    <div data-reveal>
      <span class="eyebrow" data-b="contatoSecao.eyebrow"></span>
      <h2 style="font-size:var(--fs-h2);font-weight:700;margin-block:13px 14px" data-b="contatoSecao.titulo"></h2>
      <p class="lead measure" data-b="contatoSecao.subtitulo"></p>
      <div class="contact-list">
        <a class="contact-item" data-battr="href:_links.whatsapp" target="_blank" rel="noopener">
          <span class="icon-badge"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-wa"/></svg></span>
          <span><span class="k" data-b="contatoSecao.chaves.whatsapp"></span><span class="v" data-b="contato.whatsappLabel"></span></span>
        </a>
        <a class="contact-item" data-battr="href:_links.telefone">
          <span class="icon-badge"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-phone"/></svg></span>
          <span><span class="k" data-b="contatoSecao.chaves.telefone"></span><span class="v" data-b="contato.telefoneLabel"></span></span>
        </a>
        <a class="contact-item" data-battr="href:_links.mapa" target="_blank" rel="noopener">
          <span class="icon-badge"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-pin"/></svg></span>
          <span><span class="k" data-b="contatoSecao.chaves.endereco"></span><span class="v" data-b="contato.endereco"></span></span>
        </a>
        <a class="contact-item" data-battr="href:_links.email">
          <span class="icon-badge"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-mail"/></svg></span>
          <span><span class="k" data-b="contatoSecao.chaves.email"></span><span class="v" data-b="contato.email"></span></span>
        </a>
      </div>
    </div>

    <form class="card contact-form" data-form data-reveal data-delay="1" novalidate>
      <div class="form-rows">
        <div class="row-2">
          <div class="field"><label for="f-nome" data-b="contatoSecao.form.nome"></label><input id="f-nome" name="Nome" autocomplete="name" spellcheck="false" type="text" data-battr="placeholder:contatoSecao.form.nomeHint" required></div>
          <div class="field"><label for="f-tel" data-b="contatoSecao.form.whats"></label><input id="f-tel" name="WhatsApp" autocomplete="tel" inputmode="tel" spellcheck="false" type="tel" data-battr="placeholder:contatoSecao.form.whatsHint" required></div>
        </div>
        <div class="row-2">
          <div class="field"><label for="f-esp" data-b="contatoSecao.form.especialidade"></label>
            <select id="f-esp" name="Especialidade" autocomplete="off" data-list-options="servicos.especialidades"></select>
          </div>
          <div class="field"><label for="f-conv" data-b="contatoSecao.form.convenio"></label>
            <select id="f-conv" name="Convenio" autocomplete="off" data-list-options="contatoSecao.form.convenios"></select>
          </div>
        </div>
        <div class="field"><label for="f-msg" data-b="contatoSecao.form.mensagem"></label><textarea id="f-msg" name="Mensagem" autocomplete="off" data-battr="placeholder:contatoSecao.form.mensagemHint"></textarea></div>
        <button class="btn btn-primary btn-lg btn-block" type="submit" data-b="contatoSecao.form.enviar"></button>
        <p class="form-status" data-form-status role="status" aria-live="polite"></p>
        <p class="form-note" data-b="contatoSecao.form.nota"></p>
      </div>
    </form>
  </div>
</section>

</main>

<footer class="footer">
  <div class="wrap">
    <div class="footer-grid">
      <div>
        <span class="logo" style="color:var(--footer-fg)"><span class="logo-mark" data-b="sigla" translate="no"></span><span data-b="nome" translate="no"></span></span>
        <p style="margin-top:16px;max-width:38ch;opacity:.7;font-size:15px" data-b="rodape.sobre"></p>
      </div>
      <div><h4 data-b="rodape.colNavegacao"></h4><div class="footer-links">
        <a href="#especialidades" data-b="nav.especialidades">Especialidades</a><a href="#como-funciona" data-b="nav.comoFunciona">Como funciona</a><a href="#equipe" data-b="nav.equipe">Corpo clínico</a><a href="#faq" data-b="nav.faq">Dúvidas</a>
      </div></div>
      <div><h4 data-b="rodape.colContato"></h4><div class="footer-links">
        <a data-battr="href:_links.whatsapp" target="_blank" rel="noopener" data-b="contato.whatsappLabel"></a>
        <a data-battr="href:_links.telefone" data-b="contato.telefoneLabel"></a>
        <a data-battr="href:_links.email" data-b="contato.email"></a>
      </div></div>
      <div><h4 data-b="rodape.colOnde"></h4>
        <div class="footer-links"><a data-battr="href:_links.mapa" target="_blank" rel="noopener" data-b="contato.endereco"></a></div>
        <div class="footer-links" style="margin-top:16px" data-list="redes"><template><a href="{{url}}" target="_blank" rel="noopener">{{nome}}</a></template></div>
      </div>
    </div>
    <div class="footer-bottom">
      <span>&copy; <span data-year></span> <span data-b="nome" translate="no"></span>. <span data-b="rodape.direitos"></span></span>
      <span data-b="rodape.aviso"></span>
    </div>
  </div>
</footer>

<a class="wa-float" data-battr="href:_links.whatsapp" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-wa"/></svg>
</a>

<script src="js/brand.js"></script>
<script src="js/app.js"></script>
</body>
</html>
